[project]
name = "dormbill-backend"
version = "0.1.0"
description = "宿舍账单分摊管家后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.125,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "filelock>=3.17,<4.0",
    "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
